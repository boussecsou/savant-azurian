name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste a secret, a token, an OAuth code or a full URL with a query string. Redact identifiers.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, settings (names only, not values) and the smallest example you can.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "git rev-parse --short HEAD"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Agent, Backend (BFF), Web client, Infrastructure, Documentation, CI]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: text
