[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "savant-azurian-2"
version = "0.1.0"
description = "Savant Azurian 2 — LangGraph agent hosted on Microsoft Foundry"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "azure-storage-blob>=12.0.0",
    "cryptography>=46.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "uvicorn>=0.30.0",
    "azure-identity>=1.25.0",
    "langchain-azure-ai[hosting]>=1.2.9",
    "langchain-openai>=1.0.0",
    "langchain[mcp]>=1.4.1",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.0",
    "azure-keyvault-secrets>=4.10.0",
    "asyncssh>=2.24.1",
    "tzdata>=2026.6",
    "azure-cosmos>=4.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
