name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Off until the repository variable RELEASE_PLEASE_ENABLED is `true`. It also needs the setting
    # "Allow GitHub Actions to create and approve pull requests" (Settings, Actions, General).
    if: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare the release pull request and tag
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
