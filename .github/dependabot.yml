version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    # Monthly: a lockfile change also needs `just export-requirements` on the branch (see CONTRIBUTING.md).
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # A major version is a decision, not a chore: take it by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pinned by langchain-azure-ai: newer betas make the lockfile unsatisfiable.
      - dependency-name: opentelemetry-instrumentation-openai-v2
      - dependency-name: opentelemetry-util-genai
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /pwa
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    ignore:
      # The runtime targets Python 3.13 (Foundry hosted agents); changing it is a decision, see AGENTS.md.
      - dependency-name: python
